name: GLO Draw Calendar Monitor

on:
  schedule:
    # 00:00 Thailand time (UTC+7)
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glo-calendar-monitor
  cancel-in-progress: false

jobs:
  check-official-calendar:
    name: Check official GLO draw-calendar page
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check GLO robots policy and official FAQ
        id: check
        run: python scripts/check_glo_calendar.py

      - name: Publish latest bot report
        if: always()
        run: |
          if [ -f data/bot/glo-calendar-status.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/bot/glo-calendar-status.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(bot): update GLO calendar check report"
              git push
            fi
          fi
