name: Android Build

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - security-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK for manual QA
        uses: actions/upload-artifact@v4
        with:
          name: lotto-debug-apk-manual-qa
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation-tests:
    name: Android instrumentation tests (Linux x86_64)
    runs-on: ubuntu-latest
    needs: build-debug
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Verify KVM availability
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM device /dev/kvm is not available on this runner."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -eu
            DEVICE="${ANDROID_SERIAL:-emulator-5554}"
            adb -s "$DEVICE" wait-for-device

            echo "Waiting for Android framework services..."
            ready=0
            for attempt in $(seq 1 120); do
              booted="$(adb -s "$DEVICE" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              package_ready="$(adb -s "$DEVICE" shell service check package 2>/dev/null | grep -c 'found' || true)"
              activity_ready="$(adb -s "$DEVICE" shell service check activity 2>/dev/null | grep -c 'found' || true)"
              if [ "$booted" = "1" ] && [ "$package_ready" -gt 0 ] && [ "$activity_ready" -gt 0 ]; then
                ready=1
                break
              fi
              sleep 2
            done

            if [ "$ready" -ne 1 ]; then
              echo "::error::Android framework did not become ready in time."
              adb devices -l || true
              adb -s "$DEVICE" shell getprop | grep -E 'boot|init.svc' || true
              adb -s "$DEVICE" shell service list || true
              exit 1
            fi

            adb -s "$DEVICE" shell pm list packages >/dev/null
            echo "Android package and activity services are ready."
            gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Collect emulator diagnostics on failure
        if: failure()
        run: |
          adb devices -l || true
          adb -s emulator-5554 logcat -d -t 3000 || true
          ps aux | grep -E '[e]mulator|[a]db' || true
          ls -la "$ANDROID_AVD_HOME" || true

  release-build:
    name: Release APK and App Bundle (test-gated)
    runs-on: ubuntu-latest
    needs:
      - build-debug
      - instrumentation-tests
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Prepare optional release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lotto-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/lotto-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease
          gradle --no-daemon :app:bundleRelease

      - name: Upload release APK candidate
        uses: actions/upload-artifact@v4
        with:
          name: lotto-release-apk-test-gated
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release App Bundle candidate
        uses: actions/upload-artifact@v4
        with:
          name: lotto-release-aab-test-gated
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
