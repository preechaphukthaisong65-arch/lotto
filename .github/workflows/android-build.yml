name: Android Build

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - security-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK for manual QA
        uses: actions/upload-artifact@v4
        with:
          name: lotto-debug-apk-manual-qa
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation-tests:
    name: Android instrumentation tests (Linux x86_64)
    runs-on: ubuntu-latest
    needs: build-debug
    timeout-minutes: 35
    permissions:
      contents: write
    concurrency:
      group: lotto-ci-results-publish
      cancel-in-progress: false

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Verify KVM availability
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM device /dev/kvm is not available on this runner."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            bash .github/scripts/run-tests.sh

      - name: Ensure CI result files exist
        if: always()
        run: |
          mkdir -p ci-out
          if [ ! -f ci-out/summary.md ]; then
            printf '# Android instrumentation test result\n\n- **Result:** NOT RUN / SETUP FAILED\n- **Run:** %s/%s/actions/runs/%s\n- **Commit:** %s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" > ci-out/summary.md
          fi
          [ -f ci-out/gradle-tail.log ] || printf 'No Gradle output was captured.\n' > ci-out/gradle-tail.log
          [ -f ci-out/logcat-filtered.txt ] || printf 'No filtered logcat was captured.\n' > ci-out/logcat-filtered.txt
          [ -f ci-out/RUN.txt ] || printf 'run_id=%s\nrun_attempt=%s\nrepository=%s\nref=%s\nsha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_SHA" > ci-out/RUN.txt

      - name: Upload full diagnostics (Actions artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-diagnostics
          path: |
            ci-out/logcat-full.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish sanitized CI results to ci-results branch
        if: always() && github.repository == 'preechaphukthaisong65-arch/lotto' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan ci-results
          mkdir -p latest
          cp ci-out/summary.md ci-out/gradle-tail.log ci-out/logcat-filtered.txt ci-out/RUN.txt latest/
          git add latest/summary.md latest/gradle-tail.log latest/logcat-filtered.txt latest/RUN.txt
          git commit -m "Publish sanitized instrumentation diagnostics for run $GITHUB_RUN_ID"
          git push --force origin HEAD:refs/heads/ci-results

  release-build:
    name: Release APK and App Bundle (test-gated)
    runs-on: ubuntu-latest
    needs:
      - build-debug
      - instrumentation-tests
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Prepare optional release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lotto-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/lotto-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease
          gradle --no-daemon :app:bundleRelease

      - name: Upload release APK candidate
        uses: actions/upload-artifact@v4
        with:
          name: lotto-release-apk-test-gated
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release App Bundle candidate
        uses: actions/upload-artifact@v4
        with:
          name: lotto-release-aab-test-gated
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
